<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Emotion Detection</h1>
        <div class="mb-3">
            <textarea id="textToAnalyze" class="form-control" rows="4"
                      placeholder="Escribe aquí el texto a analizar"></textarea>
        </div>
        <button class="btn btn-primary" onclick="RunSentimentAnalysis()">
            Run Sentiment Analysis
        </button>
        <p id="system_response" class="mt-4 fs-5"></p>
    </div>
</body>
</html>
